version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cab-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cab_booking
      POSTGRES_USER: cab_admin
      POSTGRES_PASSWORD: cab_secret_2024
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cab_admin -d cab_booking']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
